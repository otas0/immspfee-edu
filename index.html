<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMMSPFEE Education</title>
  <script>
    // Once per tab session: drop Cache Storage and reopen with a fresh query so
    // disk-cached modules cannot sit next to a newer curriculum.
    (function () {
      var KEY = 'immspfee-edu-hard-boot';
      var u = new URL(location.href);
      try {
        if (sessionStorage.getItem(KEY) === '1') {
          if (u.searchParams.has('boot')) {
            u.searchParams.delete('boot');
            history.replaceState(null, '', u.pathname + u.search + u.hash);
          }
          return;
        }
        sessionStorage.setItem(KEY, '1');
      } catch (e) {
        return;
      }
      var go = function () {
        u.searchParams.set('boot', String(Date.now()));
        location.replace(u.pathname + u.search + u.hash);
      };
      var clearCaches = function () {
        if (!('caches' in window)) return Promise.resolve();
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      };
      var dropSW = function () {
        if (!('serviceWorker' in navigator)) return Promise.resolve();
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        });
      };
      Promise.all([clearCaches(), dropSW()]).then(go, go);
    })();
  </script>
  <link rel="icon" type="image/png" href="./assets/immspfee-education-favicon.png?v=__BUILD__">
  <link rel="stylesheet" href="./css/edu.css?v=__BUILD__">
  <link rel="modulepreload" href="./js/app.js?v=__BUILD__">
  <link rel="modulepreload" href="./js/fmt.js?v=__BUILD__">
  <link rel="modulepreload" href="./js/i18n.js?v=__BUILD__">
  <link rel="modulepreload" href="./js/curricula/index.js?v=__BUILD__">
  <link rel="modulepreload" href="./js/sims/registry.js?v=__BUILD__">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <img src="./assets/immspfee-education-logo.png?v=__BUILD__" alt="IMMSPFEE Education" width="461" height="123">
    </a>
    <div class="top-nav">
      <div id="regions" class="seg" role="group" aria-label="Region"></div>
      <div id="books" class="seg" role="group" aria-label="Textbook"></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en">EN</button>
      <button type="button" id="lang-zh">中文</button>
    </div>
  </header>
  <div id="sw-update" class="sw-update" hidden>
    <span id="sw-update-text">Site updated</span>
    <button type="button" id="sw-reload">Reload</button>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div class="layout">
    <aside>
      <label class="search">
        <input id="search" type="search" autocomplete="off">
      </label>
      <nav id="tree"></nav>
    </aside>
    <main>
      <div class="stage-wrap">
        <canvas id="stage" width="800" height="480"></canvas>
      </div>
      <div id="readouts" class="readouts"></div>
    </main>
    <section id="teach" class="teach"></section>
  </div>
  <script type="module" src="./js/app.js?v=__BUILD__"></script>
</body>
</html>
