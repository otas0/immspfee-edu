name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test equations and curricula
        run: node scripts/test-edu.mjs
      - name: Smoke ready sim modules
        run: node scripts/smoke-sims.mjs
      - name: Guard against edition / ready-count chrome
        run: |
          ! grep -n 'id="edition"' index.html
          ! grep -n 'readyCount' js/app.js
          ! grep -n 'tag exam\|t(lang, .exam.)\|t(lang, .ready.)' js/app.js
      - name: Stamp build id into cache-busting URLs
        run: node scripts/stamp-build.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Stage Pages artifact
        run: |
          # Site-only tree: skip scripts, docs, tests, git metadata, node_modules.
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js package.json _site/
          cp -R assets css js _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .git / .github never in _site; action also excludes them if present.
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke live module URLs
        if: success()
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          for path in \
            js/sims/circuits.js \
            js/sims/em.js \
            js/sims/measure.js \
            js/sims/motion.js \
            js/sims/modern.js \
            js/sims/uni.js \
            js/sims/stat.js \
            js/sims/optics.js \
            js/sims/advance.js
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
      - name: Smoke home HTML build stamp
        id: stamp_smoke
        if: success()
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          html=$(curl -sS "$BASE/")
          if echo "$html" | grep -q '__BUILD__'; then
            echo 'FAIL: literal __BUILD__ still in index (stamp did not run)'
            exit 1
          fi
          if ! echo "$html" | grep -F "$SHORT"; then
            echo "FAIL: stamped short SHA $SHORT missing from home HTML"
            exit 1
          fi
          echo "home HTML contains stamped build $SHORT"
      - name: Report stamp failure
        if: failure() && steps.stamp_smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${SHORT:-$(echo '${{ github.sha }}' | cut -c1-7)}"
          {
            echo "### ❌ Pages home stamp failed"
            echo ""
            echo "Expected short SHA \`$SHORT\` missing from deployed \`index.html\` (or literal \`__BUILD__\` left unstamped)."
            echo ""
            echo "@otas0 please inspect the Pages artifact and \`scripts/stamp-build.mjs\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Pages stamp missing::Home HTML missing build stamp $SHORT — @otas0"
          BODY=$(printf '%s\n' \
            "Pages deploy stamp smoke failed for \`${{ github.sha }}\`." \
            "" \
            "Expected short SHA \`$SHORT\` missing from deployed \`index.html\` (or literal \`__BUILD__\` left unstamped)." \
            "" \
            "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "- Inspect artifact and \`scripts/stamp-build.mjs\`." \
            "" \
            "cc @otas0")
          TITLE="Pages stamp failed ($SHORT)"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "stamp issue already open: #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY" || true
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee otas0 || true
          fi
          exit 1
