name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test equations and curricula
        run: node scripts/test-edu.mjs
      - name: Smoke ready sim modules
        run: node scripts/smoke-sims.mjs
      - name: Guard against edition / ready-count chrome
        run: |
          ! grep -n 'id="edition"' index.html
          ! grep -n 'readyCount' js/app.js
          ! grep -n 'tag exam\|t(lang, .exam.)\|t(lang, .ready.)' js/app.js
      - name: Stamp build id into cache-busting URLs
        run: node scripts/stamp-build.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke live module URLs
        if: success()
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          for path in \
            js/sims/circuits.js \
            js/sims/em.js \
            js/sims/measure.js \
            js/sims/motion.js \
            js/sims/modern.js \
            js/sims/uni.js \
            js/sims/stat.js \
            js/sims/optics.js \
            js/sims/advance.js
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
      - name: Smoke home HTML build stamp
        if: success()
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          html=$(curl -sS "$BASE/")
          if echo "$html" | grep -q '__BUILD__'; then
            echo 'FAIL: literal __BUILD__ still in index (stamp did not run)'
            exit 1
          fi
          echo "$html" | grep -F "$SHORT"
          echo "home HTML contains stamped build $SHORT"
