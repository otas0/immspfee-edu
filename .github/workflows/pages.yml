name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    outputs:
      # Cross-job consumers (future / diagnostics): redirect-fail API retry count.
      redir_retries: ${{ steps.redir_backfill.outputs.retries_used }}
    steps:
      # Node 24 scan (2026-11): checkout@v7 + setup-node@v7 + configure-pages@v6 +
      # deploy-pages@v5 all use node24. setup-node@v6 had no Node 20 deprecation on last
      # run; bumped to @v7 (current major, also node24).
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Short SHA
        run: echo "SHORT=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Artifact name table
        run: |
          {
            echo "### Fail artifact names (short SHA \`$SHORT\`)"
            echo ""
            echo "| Kind | Artifact name | Retention |"
            echo "| --- | --- | --- |"
            echo "| redirect-fail | \`redirect-fail-headers-$SHORT\` | 7-day |"
            echo "| capture-fail | \`capture-last-fail-$SHORT\` | 7-day |"
            echo "| capture PNG | \`capture-340px-zh-long-title-$SHORT\` | 7-day |"
            echo "| capture 1280 | \`capture-1280-desktop-$SHORT\` | 7-day |"
            echo "| capture 1280 diff | \`capture-1280-diff-$SHORT\` | 7-day |"
            echo "| live-getsim-fail | \`live-getsim-fail-$SHORT\` | 7-day |"
            echo "| force_cols | in-job verify only (no artifact on green; same idea as force_fail template) | — |"
            echo "| force_fail | mirrored — see **Optional capture** job (\`force_fail=ok\` when template passes) | — |"
            echo ""
            echo "_Footnote: redirect-fail uploads only when the rename-redirect step fails; on redirect green the backfill row is \`not uploaded\` (skip reason: redirect green). live-getsim-fail is fail-only._"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test equations and curricula
        run: node scripts/test-edu.mjs
      - name: Audit physics closed-forms + ready computes
        run: node scripts/audit-physics.mjs
      - name: Bench university first-frame (subject volumes)
        run: |
          out=$(node scripts/bench-uni-first-frame.mjs)
          echo "$out"
          {
            echo "### University first-frame bench"
            echo ""
            echo '```json'
            echo "$out" | sed -n '/^{/,/^}/p'
            echo '```'
            echo ""
            echo "_Node cold import; browser network differs. Subject volumes cut idle prefetch vs one uni blob._"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke ready sim modules
        run: node scripts/smoke-sims.mjs
      - name: Lint teach dual-view layout
        run: node scripts/lint-teach-layout.mjs
      - name: Smoke projectile / finite-well layout bands
        run: node scripts/smoke-layout.mjs
      - name: Smoke 320px zh book-select CSSOM
        run: node scripts/smoke-book-select.mjs
      - name: Check immspfee-education → immspfee-edu redirect
        id: redirect
        env:
          REQUIRE_REDIRECT_CHECK: '1'
        run: bash scripts/check-rename-redirect.sh
      - name: Upload redirect fail headers
        id: up_redir
        if: failure() && steps.redirect.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: redirect-fail-headers-${{ env.SHORT }}
          path: .local-shots/redirect-fail-headers.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Redirect-fail artifact backfill
        id: redir_backfill
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry 1s×5 only while the expected name is still missing (empty list or lag).
          fetch_artifact_names_until() {
            local want="$1" names="" i
            RETRIES_USED=0
            for i in 1 2 3 4 5; do
              RETRIES_USED=$i
              names="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '.artifacts[].name' 2>/dev/null || true)"
              if echo "$names" | grep -qx "$want"; then
                printf '%s\n' "$names"
                return 0
              fi
              sleep 1
            done
            printf '%s\n' "$names"
          }
          redir="—"
          redir_api="not uploaded"
          skip_reason=""
          retries_note="—"
          RETRIES_USED=0
          if [ "${{ steps.redirect.outcome }}" = "failure" ]; then
            redir_api="—"
            if [ "${{ steps.up_redir.outcome }}" = "success" ] \
              && [ -f .local-shots/redirect-fail-headers.txt ]; then
              redir="✅"
            elif [ "${{ steps.up_redir.outcome }}" = "failure" ]; then
              redir="❌"
            elif [ -f .local-shots/redirect-fail-headers.txt ]; then
              redir="✅"
            else
              redir="❌"
            fi
            api_names="$(fetch_artifact_names_until "redirect-fail-headers-${SHORT}")"
            retries_note="${RETRIES_USED:-?} attempt(s)"
            if echo "$api_names" | grep -qx "redirect-fail-headers-${SHORT}"; then
              redir_api="✅"
              redir="✅"
            fi
          elif [ "${{ steps.redirect.outcome }}" = "success" ]; then
            redir="— (not expected)"
            redir_api="not uploaded"
            skip_reason="skip reason: redirect green"
            retries_note="0 (skipped — redirect green)"
            RETRIES_USED=0
          fi
          {
            echo "### Redirect-fail artifact backfill"
            echo ""
            echo "| Kind | Local/step | API | retries_used |"
            echo "| --- | --- | --- | --- |"
            echo "| redirect-fail (\`redirect-fail-headers-${SHORT}\`) | $redir | $redir_api | ${RETRIES_USED:-0} ($retries_note) |"
            if [ -n "$skip_reason" ]; then
              echo ""
              echo "$skip_reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "retries_used=${RETRIES_USED:-0}" >> "$GITHUB_OUTPUT"
      - name: Guard against edition / ready-count chrome
        run: |
          ! grep -n 'id="edition"' index.html
          ! grep -n 'readyCount' js/app.js
          ! grep -n 'tag exam\|t(lang, .exam.)\|t(lang, .ready.)' js/app.js
      - name: Stamp build id into cache-busting URLs
        run: node scripts/stamp-build.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Stage Pages artifact
        run: |
          # Site-only tree: skip scripts, docs, tests, package.json, git, node_modules.
          rm -rf _site
          mkdir -p _site
          # Root favicon.ico must ship — Safari fetches /favicon.ico by origin, ignoring link tags when it 404s.
          cp index.html sw.js favicon.ico _site/
          cp -R assets css js _site/
          BEFORE=$(du -sk --exclude=.git --exclude=node_modules --exclude=_site . | awk '{print $1}')
          AFTER=$(du -sk _site | awk '{print $1}')
          LINT_B=$(wc -c < scripts/lint-teach-layout.mjs | tr -d ' ')
          SMOKE_B=$(wc -c < scripts/smoke-layout.mjs | tr -d ' ')
          BOOK_B=$(wc -c < scripts/smoke-book-select.mjs | tr -d ' ')
          ENSURE_B=$(wc -c < scripts/ensure-dev-server.sh | tr -d ' ')
          CAPTURE_B=$(wc -c < scripts/capture-340px-long-title.mjs | tr -d ' ')
          DOM_B=$(wc -c < scripts/dom-lite.mjs | tr -d ' ')
          REDIR_B=$(wc -c < scripts/check-rename-redirect.sh | tr -d ' ')
          ZWJ_B=$(wc -c < scripts/toast-zwj-table.md | tr -d ' ')
          START_B=$(wc -c < scripts/npm-start.sh | tr -d ' ')
          {
            echo "### Pages artifact size"
            echo ""
            echo "| Tree | Size |"
            echo "| --- | ---: |"
            echo "| Repo (ex .git/node_modules/_site) | ${BEFORE} KiB |"
            echo "| Staged \`_site\` | ${AFTER} KiB |"
            # All size rows stay pure KiB (no mixed B on Saved or script rows).
            echo "| Saved | $((BEFORE - AFTER)) KiB |"
            echo "| \`lint-teach-layout.mjs\` (CI only) | $(( (LINT_B + 1023) / 1024 )) KiB |"
            echo "| \`smoke-layout.mjs\` (CI only) | $(( (SMOKE_B + 1023) / 1024 )) KiB |"
            echo "| \`smoke-book-select.mjs\` (CI only) | $(( (BOOK_B + 1023) / 1024 )) KiB |"
            echo "| \`capture-340px-long-title.mjs\` (optional CI) | $(( (CAPTURE_B + 1023) / 1024 )) KiB |"
            echo "| \`dom-lite.mjs\` (CI only) | $(( (DOM_B + 1023) / 1024 )) KiB |"
            echo "| \`check-rename-redirect.sh\` (CI only) | $(( (REDIR_B + 1023) / 1024 )) KiB |"
            echo "| \`toast-zwj-table.md\` (docs) | $(( (ZWJ_B + 1023) / 1024 )) KiB |"
            echo "| \`npm-start.sh\` (local only) | $(( (START_B + 1023) / 1024 )) KiB |"
            echo "| \`ensure-dev-server.sh\` (local only) | $(( (ENSURE_B + 1023) / 1024 )) KiB |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages artifact: ${AFTER} KiB (was ${BEFORE} KiB working tree)"
      # Node 24 re-scan: configure-pages@v6 + deploy-pages@v5 both using:node24.
      # punycode DEP0040 still soft (actions/deploy-pages#413 / #434). Re-checked 2026-11-07 PM:
      # latest release still v5.0.1 (2026-09-01); #433 still open/unmerged — hold pin; bump day-of merge.
      # When #413 ships a patch (v5.0.2+), bump immediately and confirm DEP0040 gone before merge.
      # Keep this bump track separate from push-main watch-flake soft-ok work.
      # ubuntu-24.04 pin: probe with `bash scripts/pages-ubuntu26-probe.sh` before moving to 26.
      # Do not suppress. upload-pages-artifact@v5 bundles upload-artifact@v7.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .git / .github never in _site; action also excludes them if present.
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke live module URLs
        if: success()
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          for path in \
            js/sims/circuits.js \
            js/sims/em.js \
            js/sims/measure.js \
            js/sims/motion.js \
            js/sims/phase.js \
            js/sims/modern.js \
            js/sims/uni.js \
            js/sims/stat.js \
            js/sims/rel.js \
            js/sims/optics.js \
            js/sims/advance.js \
            js/sims/kit.js \
            js/physics/optics.js \
            js/physics/uni.js
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/$path?v=$SHORT")
            echo "$path -> $code"
            test "$code" = "200"
          done
      - name: Smoke live getSim (cross-group sample)
        id: live_getsim
        if: success()
        env:
          PAGES_BASE: ${{ steps.deployment.outputs.page_url }}
          SHORT: ${{ env.SHORT }}
          # One id per PATHS group (optics…rel). Stat rotation: hydrogen-radial (was wave-packet ← ising).
          LIVE_GETSIM_IDS: convex-lens,friction,density,lever,circuit,projectile,melting,oscillator,heat-engine,ruler,sound-wave,induction,collide,charges,time-dilation,finite-well,hydrogen-radial,length-contraction
        run: node scripts/smoke-live-getsim.mjs
      - name: Upload live getSim fail diag
        if: failure() && steps.live_getsim.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: live-getsim-fail-${{ env.SHORT }}
          path: |
            .local-shots/live-getsim-fail.md
            .local-shots/live-getsim-diag/
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke home HTML build stamp
        id: stamp_smoke
        if: success()
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          html=$(curl -sS "$BASE/")
          if echo "$html" | grep -q '__BUILD__'; then
            echo 'FAIL: literal __BUILD__ still in index (stamp did not run)'
            exit 1
          fi
          if ! echo "$html" | grep -F "$SHORT"; then
            echo "FAIL: stamped short SHA $SHORT missing from home HTML"
            exit 1
          fi
          echo "home HTML contains stamped build $SHORT"
      - name: Report stamp failure
        if: failure() && steps.stamp_smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${SHORT:-$(echo '${{ github.sha }}' | cut -c1-7)}"
          {
            echo "### ❌ Pages home stamp failed"
            echo ""
            echo "Expected short SHA \`$SHORT\` missing from deployed \`index.html\` (or literal \`__BUILD__\` left unstamped)."
            echo ""
            echo "@otas0 please inspect the Pages artifact and \`scripts/stamp-build.mjs\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Pages stamp missing::Home HTML missing build stamp $SHORT — @otas0"
          BODY=$(printf '%s\n' \
            "Pages deploy stamp smoke failed for \`${{ github.sha }}\`." \
            "" \
            "Expected short SHA \`$SHORT\` missing from deployed \`index.html\` (or literal \`__BUILD__\` left unstamped)." \
            "" \
            "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "- Inspect artifact and \`scripts/stamp-build.mjs\`." \
            "" \
            "cc @otas0")
          TITLE="Pages stamp failed ($SHORT)"
          RUN_ID="${{ github.run_id }}"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "stamp issue already open: #$EXISTING"
            # Same workflow run must not pile duplicate comments.
            ALREADY=$(gh api "repos/${{ github.repository }}/issues/${EXISTING}/comments" \
              --jq ".[].body" 2>/dev/null | grep -F "actions/runs/${RUN_ID}" || true)
            if [ -n "$ALREADY" ]; then
              echo "skip comment: run $RUN_ID already noted on #$EXISTING"
            else
              gh issue comment "$EXISTING" --body "$BODY" || true
            fi
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee otas0 || true
          fi
          exit 1

  # Optional: read deploy.redir_retries without blocking the parallel capture job.
  redir-retries-diag:
    name: Redirect retries diag
    needs: [deploy]
    if: always() && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Echo deploy redir_retries
        run: |
          RR="${{ needs.deploy.outputs.redir_retries }}"
          echo "deploy.outputs.redir_retries=${RR:-"(empty)"}"
          {
            echo "### Redirect retries (cross-job diag)"
            echo ""
            echo "| Source | Value |"
            echo "| --- | --- |"
            echo "| \`needs.deploy.outputs.redir_retries\` | \`${RR:-empty}\` |"
            echo ""
            echo "Capture job stays parallel (no \`needs: deploy\`). This diag job alone consumes the output."
          } >> "$GITHUB_STEP_SUMMARY"
          # Empty / missing output is a wiring bug — warn (continue-on-error keeps Pages green).
          if [ -z "$RR" ]; then
            echo "::warning::redir_retries empty — deploy redir_backfill may have skipped GITHUB_OUTPUT or job output map is unset"
            echo ""
            echo "**Warning:** \`redir_retries\` was empty (not a numeric retry count)." >> "$GITHUB_STEP_SUMMARY"
          fi

  capture-340-title:
    name: Optional capture 340px title
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Capture is advisory: never fail the Pages workflow on screenshot/Playwright issues.
    # Does NOT needs: deploy — redir_retries is read by redir-retries-diag instead.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Short SHA
        run: echo "SHORT=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Artifact name table
        run: |
          {
            echo "### Fail artifact names (short SHA \`$SHORT\`)"
            echo ""
            echo "| Kind | Artifact name | Retention |"
            echo "| --- | --- | --- |"
            echo "| redirect-fail | \`redirect-fail-headers-$SHORT\` | 7-day |"
            echo "| capture-fail | \`capture-last-fail-$SHORT\` | 7-day |"
            echo "| capture PNG | \`capture-340px-zh-long-title-$SHORT\` | 7-day |"
            echo "| capture 1280 | \`capture-1280-desktop-$SHORT\` | 7-day |"
            echo "| force_fail | ok when template step passes (authoritative here; deploy job mirrors this row) | — |"
            echo "| force_cols | in-job verify only (no green-run \`capture-cols-fail\` upload; real fails → \`capture-last-fail\`) | — |"
            echo ""
            echo "_Footnote: redirect-fail lives on the **deploy** job; upload only when rename-redirect fails (skip reason: redirect green → not uploaded). \`redir_retries\` is echoed by the **Redirect retries diag** job (not by capture)._"
          } >> "$GITHUB_STEP_SUMMARY"
      # Pin: scripts/playwright-version.txt — when bumping, also reinstall /tmp/pw-shot locally
      # (see .local-shots/README.md) so NODE_PATH captures stay on the same Chromium.
      - name: Notice if Playwright pin changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No before SHA; skip pin diff"
            exit 0
          fi
          if ! git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx 'scripts/playwright-version.txt'; then
            exit 0
          fi
          DIFF="$(git diff "$BEFORE" "${{ github.sha }}" -- scripts/playwright-version.txt || true)"
          PIN_VER="$(tr -d ' \n\r' < scripts/playwright-version.txt)"
          PIN_HASH="$(printf '%s' "$PIN_VER" | shasum -a 256 | cut -c1-8)"
          {
            echo "### Playwright pin changed"
            echo ""
            echo "@otas0 bump \`/tmp/pw-shot\` to match \`scripts/playwright-version.txt\` (see \`.local-shots/README.md\`)."
            echo ""
            echo "Pin \`$PIN_VER\` (hash \`$PIN_HASH\`)."
            echo ""
            echo '```'
            echo "$DIFF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Playwright pin changed::@otas0 reinstall /tmp/pw-shot to the new pin"
          # Dedup by pin *content* hash among OPEN issues only. A closed issue with the
          # same hash must not be reused — bump again after close creates a fresh issue.
          TITLE="Playwright pin changed ($PIN_HASH)"
          BODY=$(printf '%s\n' \
            "Playwright pin file changed on \`${{ github.sha }}\` (short \`$SHORT\`)." \
            "" \
            "Pin \`$PIN_VER\` (content hash \`$PIN_HASH\`)." \
            "" \
            "@otas0 please reinstall \`/tmp/pw-shot\` to match \`scripts/playwright-version.txt\`." \
            "" \
            '```' \
            "$DIFF" \
            '```' \
            "" \
            "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          RUN_ID="${{ github.run_id }}"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number,title,state \
            --jq "[.[] | select(.title == \"$TITLE\" and (.state | ascii_upcase) == \"OPEN\")] | .[0].number // empty" || true)
          if [ -n "$EXISTING" ]; then
            # Same workflow run must not pile duplicate pin comments.
            ALREADY=$(gh api "repos/${{ github.repository }}/issues/${EXISTING}/comments" \
              --jq ".[].body" 2>/dev/null | grep -F "actions/runs/${RUN_ID}" || true)
            if [ -n "$ALREADY" ]; then
              echo "skip pin comment: run $RUN_ID already noted on #$EXISTING"
            else
              gh issue comment "$EXISTING" --body "$BODY" || true
            fi
          else
            # Closed/same-title matches are ignored on purpose (state=open filter above).
            gh issue create --title "$TITLE" --body "$BODY" --assignee otas0 || true
          fi
      - name: Install Playwright or skip
        id: pw
        run: |
          set +e
          PW_VER="$(tr -d ' \n\r' < scripts/playwright-version.txt)"
          echo "Playwright pin: $PW_VER (bump /tmp/pw-shot when changing this file)"
          npm install --no-save "playwright@${PW_VER}"
          INSTALL_PKG=$?
          if [ "$INSTALL_PKG" -ne 0 ]; then
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Playwright package unavailable — skipping capture:340-title"
            exit 0
          fi
          npx playwright install chromium
          INSTALL_BR=$?
          if [ "$INSTALL_BR" -ne 0 ]; then
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Playwright Chromium unavailable — skipping capture:340-title"
            exit 0
          fi
          echo "have=1" >> "$GITHUB_OUTPUT"
      - name: Ensure preview for capture
        if: steps.pw.outputs.have == '1'
        run: bash scripts/ensure-dev-server.sh --no-exec --quiet
      - name: Optional slow-load toast (optics hang → 8s Reload)
        if: steps.pw.outputs.have == '1'
        continue-on-error: true
        run: |
          set +e
          PREVIEW_BASE=http://127.0.0.1:4174 node scripts/smoke-slow-load-toast.mjs
          code=$?
          {
            echo "### Optional smoke:slow-toast"
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "Loading → 8s \`simLoadSlow\` + Reload while \`optics.js\` hung — **ok**."
            else
              echo "slow-toast exited $code — **non-blocking** (\`continue-on-error\`)."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Probe uni-cm + uni-qm prefetch (cross-check bench)
        if: steps.pw.outputs.have == '1'
        run: |
          cm=$(PREVIEW_BASE=http://127.0.0.1:4174 node scripts/probe-uni-prefetch.mjs)
          qm=$(PREVIEW_BASE=http://127.0.0.1:4174 PROBE_LESSON=uni-qm-1 node scripts/probe-uni-prefetch.mjs)
          rel=$(PREVIEW_BASE=http://127.0.0.1:4174 PROBE_LESSON=uni-rel-1 node scripts/probe-uni-prefetch.mjs)
          bench=$(node scripts/bench-uni-first-frame.mjs)
          echo "$cm"
          echo "$qm"
          echo "$rel"
          echo "$bench"
          {
            echo "### University prefetch ↔ first-frame bench"
            echo ""
            echo "| Probe | Expect | Result |"
            echo "| --- | --- | --- |"
            echo "| \`uni-cm-1\` Network | \`advance.js\` only (no optics/stat) | see JSON |"
            echo "| \`uni-qm-1\` Network | \`stat.js\` (+ optional \`uni.js\`); no optics | see JSON |"
            echo "| \`uni-rel-1\` Network | \`modern.js\` (+ optional \`rel.js\`); no optics | see JSON |"
            echo "| \`bench:uni-first\` | subject volume sim counts | see JSON |"
            echo ""
            echo "#### uni-cm Network"
            echo '```json'
            echo "$cm" | sed -n '/^{/,/^}/p'
            echo '```'
            echo ""
            echo "#### uni-qm Network"
            echo '```json'
            echo "$qm" | sed -n '/^{/,/^}/p'
            echo '```'
            echo ""
            echo "#### uni-rel Network"
            echo '```json'
            echo "$rel" | sed -n '/^{/,/^}/p'
            echo '```'
            echo ""
            echo "#### bench:uni-first"
            echo '```json'
            echo "$bench" | sed -n '/^{/,/^}/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Force-fail capture summary template
        id: force_fail
        if: steps.pw.outputs.have == '1'
        continue-on-error: true
        run: |
          FAIL_MD=.local-shots/capture-last-fail.md
          ART_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ART_NAME="capture-last-fail-${SHORT}"
          fail_summary() {
            {
              echo "### ❌ Force-fail capture summary template"
              echo ""
              echo "$1"
              echo ""
              echo "Artifact (when uploaded): [\`$ART_NAME\`]($ART_URL) — open the run → Artifacts."
              echo ""
              if [ -f "$FAIL_MD" ]; then
                echo "#### capture-last-fail.md"
                echo ""
                cat "$FAIL_MD"
              else
                echo "_(no \`$FAIL_MD\` on disk to paste)_"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }
          set +e
          CAPTURE_FORCE_FAIL=1 npm run capture:340-title
          code340=$?
          set -e
          if [ "$code340" -eq 0 ]; then
            fail_summary "CAPTURE_FORCE_FAIL=1 capture:340 exited 0 — expected non-zero so the overflow/topH template is exercised."
            exit 1
          fi
          if [ ! -f "$FAIL_MD" ] || ! grep -q 'overflow:' "$FAIL_MD" || ! grep -q 'topH:' "$FAIL_MD"; then
            fail_summary "Verification failed (340): \`$FAIL_MD\` missing or lacks \`overflow:\` / \`topH:\`."
            exit 1
          fi
          rm -f "$FAIL_MD"
          # Same short-SHA force-fail template path for capture:1280.
          set +e
          CAPTURE_FORCE_FAIL=1 npm run capture:1280
          code1280=$?
          set -e
          if [ "$code1280" -eq 0 ]; then
            fail_summary "CAPTURE_FORCE_FAIL=1 capture:1280 exited 0 — expected non-zero so the overflow/topH template is exercised."
            exit 1
          fi
          if [ ! -f "$FAIL_MD" ] || ! grep -q 'overflow:' "$FAIL_MD" || ! grep -q 'topH:' "$FAIL_MD"; then
            fail_summary "Verification failed (1280): \`$FAIL_MD\` missing or lacks \`overflow:\` / \`topH:\`."
            exit 1
          fi
          {
            echo "### Force-fail capture summary template"
            echo ""
            echo "Verified overflow/topH block (CAPTURE_FORCE_FAIL=1) for **340** and **1280** (same short-SHA table)."
            echo ""
            echo "| Kind | Status | Retention |"
            echo "| --- | --- | --- |"
            echo "| force_fail | ok | — |"
            echo "| capture PNG | \`capture-340px-zh-long-title-${SHORT}\` | 7-day |"
            echo "| capture 1280 | \`capture-1280-desktop-${SHORT}\` | 7-day |"
            echo "| capture-fail (template) | verified | 7-day if uploaded |"
            echo ""
            cat "$FAIL_MD"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$FAIL_MD"
          echo "force-fail summary template ok (340+1280)"
      - name: Force-cols-fail 1280 (verify only; no green upload)
        id: force_cols
        if: steps.pw.outputs.have == '1'
        continue-on-error: true
        run: |
          FAIL_MD=.local-shots/capture-last-fail.md
          rm -f "$FAIL_MD"
          set +e
          CAPTURE_FORCE_COLS_FAIL=1 npm run capture:1280
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "CAPTURE_FORCE_COLS_FAIL=1 exited 0 — expected non-zero"
            exit 1
          fi
          if [ ! -f "$FAIL_MD" ] || ! grep -q 'three columns' "$FAIL_MD"; then
            echo "Verification failed: $FAIL_MD missing three-columns assert body"
            exit 1
          fi
          {
            echo "### Force-cols-fail 1280 (three-column assert → fail md)"
            echo ""
            echo "Verified fail md in-job (\`CAPTURE_FORCE_COLS_FAIL=1\`). **No artifact upload on green** — real capture failures use \`capture-last-fail-$SHORT\` via the fail-only upload step (aligned with force_fail)."
            echo ""
            echo "| Kind | Status |"
            echo "| --- | --- |"
            echo "| force_cols | ok (verify only) |"
            echo "| artifact | not uploaded on green |"
            echo ""
            cat "$FAIL_MD"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "force-cols-fail md ok (verify only; no green upload)"
      - name: Clear force-cols fail md before real captures
        if: always() && steps.pw.outputs.have == '1'
        run: rm -f .local-shots/capture-last-fail.md
      - name: Run capture:340-title
        id: capture
        if: steps.pw.outputs.have == '1'
        continue-on-error: true
        # GITHUB_STEP_SUMMARY is injected by Actions; on assert fail the script appends overflow/topH.
        run: npm run capture:340-title
      - name: Run capture:1280 desktop baseline
        id: capture1280
        if: steps.pw.outputs.have == '1'
        continue-on-error: true
        run: npm run capture:1280
      - name: Run capture:poster (A4 fit)
        id: captureposter
        if: steps.pw.outputs.have == '1'
        continue-on-error: true
        run: |
          # Start a local preview for docs/promo (not on Pages staging).
          ENSURE_QUIET=1 bash scripts/ensure-dev-server.sh --no-exec || true
          npm run capture:poster
      - name: Upload poster reference shots
        if: always() && steps.captureposter.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: capture-poster-${{ env.SHORT }}
          path: |
            .local-shots/poster-a4-reference.png
            .local-shots/poster-340px-screen.png
            .local-shots/poster-speaker-zh.png
            .local-shots/poster-a4.pdf
            .local-shots/poster-a4-fit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Optional 1280 pixel diff vs prior artifact
        id: capture1280diff
        if: always() && steps.pw.outputs.have == '1' && steps.capture1280.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_1280_DIFF: '1'
        run: |
          # Download newest prior capture-1280-desktop-* from a successful run (best-effort).
          mkdir -p .local-shots
          PREV=""
          set +e
          art_json="$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=30" --jq \
            '[.artifacts[] | select(.name | startswith("capture-1280-desktop-")) | select(.expired==false)] | sort_by(.created_at) | reverse | .[0]')"
          set -e
          name="$(echo "$art_json" | jq -r '.name // empty')"
          aid="$(echo "$art_json" | jq -r '.id // empty')"
          if [ -n "$aid" ] && [ "$name" != "capture-1280-desktop-${SHORT}" ]; then
            echo "prior artifact: $name ($aid)"
            gh api "repos/${{ github.repository }}/actions/artifacts/${aid}/zip" > /tmp/1280-prev.zip \
              && unzip -o /tmp/1280-prev.zip -d /tmp/1280-prev \
              && PREV="$(find /tmp/1280-prev -name '*.png' | head -n 1)"
          else
            echo "No prior distinct 1280 artifact; diff will soft-skip"
          fi
          if [ -n "${PREV}" ] && [ -f "${PREV}" ]; then
            cp "$PREV" .local-shots/1280-desktop-prev.png
            export CAPTURE_1280_PREV=.local-shots/1280-desktop-prev.png
          fi
          node scripts/capture-1280-diff.mjs
      - name: Upload 1280 diff summary
        if: always() && steps.capture1280diff.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: capture-1280-diff-${{ env.SHORT }}
          path: |
            .local-shots/1280-desktop-diff.md
            .local-shots/1280-desktop-diff-thumb.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture step summary
        if: always()
        run: |
          ART_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### Optional capture:340-title / 1280"
            echo ""
            echo "| Kind | Artifact / status | Retention |"
            echo "| --- | --- | --- |"
            echo "| redirect-fail | \`redirect-fail-headers-${SHORT}\` | 7-day |"
            echo "| capture-fail | \`capture-last-fail-${SHORT}\` | 7-day |"
            echo "| capture PNG | \`capture-340px-zh-long-title-${SHORT}\` | 7-day |"
            echo "| capture 1280 | \`capture-1280-desktop-${SHORT}\` | 7-day |"
            if [ "${{ steps.pw.outputs.have }}" != "1" ]; then
              echo "| force_fail | skipped (no Playwright) | — |"
            elif [ "${{ steps.force_fail.outcome }}" = "success" ]; then
              echo "| force_fail | ok | — |"
            elif [ "${{ steps.force_fail.outcome }}" = "failure" ]; then
              echo "| force_fail | ❌ failed (non-blocking) | — |"
            else
              echo "| force_fail | \`${{ steps.force_fail.outcome }}\` | — |"
            fi
            echo ""
            if [ "${{ steps.pw.outputs.have }}" != "1" ]; then
              echo "Skipped (Playwright unavailable)."
            elif [ "${{ steps.force_fail.outcome }}" = "failure" ]; then
              echo "### ❌ Force-fail template verification failed (non-blocking)."
              echo ""
              echo "See [\`capture-last-fail-${SHORT}\`]($ART_URL) artifact if uploaded."
              echo ""
              if [ -f .local-shots/capture-last-fail.md ]; then
                echo "#### capture-last-fail.md"
                echo ""
                cat .local-shots/capture-last-fail.md
              fi
            fi
            if [ "${{ steps.pw.outputs.have }}" != "1" ]; then
              :
            elif [ "${{ steps.capture.outcome }}" = "success" ]; then
              echo "340 capture succeeded."
              # Do not wipe fail md if 1280 failed (three-column assert writes capture-last-fail.md).
              if [ "${{ steps.capture1280.outcome }}" = "success" ] \
                || [ "${{ steps.capture1280.outcome }}" = "skipped" ]; then
                rm -f .local-shots/capture-last-fail.md
              fi
            elif [ "${{ steps.capture.outcome }}" = "failure" ]; then
              echo "340 capture failed — **non-blocking** (\`continue-on-error\`). Deploy may still be green."
              echo ""
              echo "Detail artifact: [\`capture-last-fail-${SHORT}\`]($ART_URL)."
              echo ""
              if [ -f .local-shots/capture-last-fail.md ]; then
                cat .local-shots/capture-last-fail.md
              else
                echo "No capture-last-fail.md (overflow/topH detail missing — check job logs)."
              fi
            else
              echo "340 outcome: \`${{ steps.capture.outcome }}\` / Playwright have=\`${{ steps.pw.outputs.have }}\`"
            fi
            echo ""
            echo "1280 desktop baseline: \`${{ steps.capture1280.outcome }}\` → artifact \`capture-1280-desktop-${SHORT}\`."
            if [ "${{ steps.capture1280.outcome }}" = "failure" ]; then
              echo ""
              echo "1280 failed — **non-blocking**; three-column / viewport assert detail uploads as [\`capture-last-fail-${SHORT}\`]($ART_URL) when present."
              echo ""
              if [ -f .local-shots/capture-last-fail.md ]; then
                echo "#### capture-last-fail.md (1280)"
                echo ""
                cat .local-shots/capture-last-fail.md
              else
                echo "No capture-last-fail.md after 1280 failure — check job logs; upload step still runs (\`if-no-files-found: ignore\`)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.capture.outcome }}" = "failure" ]; then
            echo "::warning::capture:340-title failed (workflow continues)"
          fi
          if [ "${{ steps.capture1280.outcome }}" = "failure" ]; then
            echo "::warning::capture:1280 failed (workflow continues; capture-last-fail upload when md present)"
          fi
      - name: Upload 340px capture PNG
        id: up_png
        if: always() && steps.pw.outputs.have == '1'
        uses: actions/upload-artifact@v7
        with:
          name: capture-340px-zh-long-title-${{ env.SHORT }}
          path: .local-shots/340px-zh-long-title-ellipsis.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload 1280 desktop capture PNG
        id: up_1280
        if: always() && steps.pw.outputs.have == '1'
        uses: actions/upload-artifact@v7
        with:
          name: capture-1280-desktop-${{ env.SHORT }}
          path: .local-shots/1280-desktop-three-column.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload capture-last-fail.md
        id: up_fail
        if: always() && steps.pw.outputs.have == '1' && (steps.force_fail.outcome == 'failure' || steps.capture.outcome == 'failure' || steps.capture1280.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: capture-last-fail-${{ env.SHORT }}
          path: .local-shots/capture-last-fail.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Artifact upload backfill
        id: art_backfill
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          png="—"
          png1280="—"
          fail="—"
          if [ "${{ steps.pw.outputs.have }}" = "1" ]; then
            if [ -f .local-shots/340px-zh-long-title-ellipsis.png ] \
              && [ "${{ steps.up_png.outcome }}" = "success" ]; then
              png="✅"
            elif [ "${{ steps.up_png.outcome }}" = "failure" ]; then
              png="❌"
            fi
            if [ -f .local-shots/1280-desktop-three-column.png ] \
              && [ "${{ steps.up_1280.outcome }}" = "success" ]; then
              png1280="✅"
            elif [ "${{ steps.up_1280.outcome }}" = "failure" ]; then
              png1280="❌"
            fi
            if [ "${{ steps.up_fail.outcome }}" = "success" ] \
              && [ -f .local-shots/capture-last-fail.md ]; then
              fail="✅"
            elif [ "${{ steps.up_fail.outcome }}" = "failure" ]; then
              fail="❌"
            elif [ "${{ steps.up_fail.outcome }}" = "skipped" ]; then
              fail="—"
            fi
          fi
          # Retry 1s×5 only while any expected short-SHA name is still missing.
          RETRIES_USED=0
          fetch_until_names() {
            local names="" i want
            RETRIES_USED=0
            for i in 1 2 3 4 5; do
              RETRIES_USED=$i
              names="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '.artifacts[].name' 2>/dev/null || true)"
              local missing=0
              for want in "$@"; do
                if ! echo "$names" | grep -qx "$want"; then
                  missing=1
                  break
                fi
              done
              if [ "$missing" -eq 0 ]; then
                printf '%s\n' "$names"
                return 0
              fi
              sleep 1
            done
            printf '%s\n' "$names"
          }
          expect_names=()
          [ "${{ steps.up_png.outcome }}" = "success" ] \
            && expect_names+=("capture-340px-zh-long-title-${SHORT}")
          [ "${{ steps.up_1280.outcome }}" = "success" ] \
            && expect_names+=("capture-1280-desktop-${SHORT}")
          [ "${{ steps.up_fail.outcome }}" = "success" ] \
            && expect_names+=("capture-last-fail-${SHORT}")
          if [ ${#expect_names[@]} -gt 0 ]; then
            api_names="$(fetch_until_names "${expect_names[@]}")"
          else
            RETRIES_USED=1
            api_names="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[].name' 2>/dev/null || true)"
          fi
          png_api="—"
          png1280_api="—"
          fail_api="—"
          if echo "$api_names" | grep -qx "capture-340px-zh-long-title-${SHORT}"; then
            png_api="✅"
            png="✅"
          fi
          if echo "$api_names" | grep -qx "capture-1280-desktop-${SHORT}"; then
            png1280_api="✅"
            png1280="✅"
          fi
          if echo "$api_names" | grep -qx "capture-last-fail-${SHORT}"; then
            fail_api="✅"
            fail="✅"
          fi
          {
            echo "### Artifact upload backfill"
            echo ""
            echo "| Kind | Local/step | API | retries_used |"
            echo "| --- | --- | --- | --- |"
            echo "| capture PNG (\`capture-340px-zh-long-title-${SHORT}\`) | $png | $png_api | ${RETRIES_USED} |"
            echo "| capture 1280 (\`capture-1280-desktop-${SHORT}\`) | $png1280 | $png1280_api | ${RETRIES_USED} |"
            echo "| capture-fail (\`capture-last-fail-${SHORT}\`) | $fail | $fail_api | ${RETRIES_USED} |"
            echo "| redirect-fail | — (deploy job / diag) | — | — |"
            if [ "${{ steps.force_fail.outcome }}" = "success" ]; then
              echo "| force_fail (340+1280) | ok | — | — |"
            elif [ "${{ steps.force_fail.outcome }}" = "failure" ]; then
              echo "| force_fail (340+1280) | ❌ | — | — |"
            else
              echo "| force_fail (340+1280) | — | — | — |"
            fi
            if [ "${{ steps.force_cols.outcome }}" = "success" ]; then
              echo "| force_cols (1280→fail md verify only) | ok | — | — |"
            elif [ "${{ steps.force_cols.outcome }}" = "failure" ]; then
              echo "| force_cols (1280→fail md verify only) | ❌ | — | — |"
            else
              echo "| force_cols (1280→fail md verify only) | — | — | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "retries_used=${RETRIES_USED:-0}" >> "$GITHUB_OUTPUT"
